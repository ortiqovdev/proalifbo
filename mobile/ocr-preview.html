<!doctype html><meta charset="utf-8"><script src="./tesseract.min.js"></script><script>
async function recognizePhoto(photo) {
  const worker = await Tesseract.createWorker(['uzb','uzb_cyrl'], 1, {
    workerPath: new URL('./worker.min.js', location.href).href,
    corePath: new URL('./tesseract-core-lstm.wasm.js', location.href).href,
    langPath: new URL('./', location.href).href,
    cacheMethod: 'none'
  });
  try {
    const { data } = await worker.recognize(photo);
    return data.text;
  } finally { await worker.terminate(); }
}
async function readPhoto(data) {
  try { window.ReactNativeWebView.postMessage(JSON.stringify({text:await recognizePhoto(data)})); }
  catch { window.ReactNativeWebView.postMessage(JSON.stringify({error:true})); }
}
</script>
