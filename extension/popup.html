<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pro Alifbo</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="brand">
    <img src="assets/logo.png" width="40" height="40" alt="Pro Alifbo logosi">
    <h1>Pro Alifbo</h1>
    <span class="status-dot" title="Internetsiz ishlaydi" aria-label="Internetsiz ishlaydi"></span>
  </header>
  <main>
    <section class="input-card" aria-labelledby="input-label">
      <div class="field-top"><label id="input-label" for="source">Matningiz</label><span class="badge">Avtomatik</span></div>
      <textarea id="source" maxlength="12000" spellcheck="false" autofocus placeholder="Matn yozing yoki shu yerga joylang…" aria-describedby="input-hint"></textarea>
      <div class="field-bottom"><span id="input-hint">Lotin · Кирилл · Yangi alifbo</span><button type="button" id="clear" disabled>Tozalash</button></div>
    </section>
    <fieldset class="target">
      <legend>Natija alifbosini tanlang</legend>
      <div class="segments">
        <label><input type="radio" name="target" value="latin"><span>Lotin</span></label>
        <label><input type="radio" name="target" value="kirill"><span>Кирилл</span></label>
        <label><input type="radio" name="target" value="new" checked><span>Yangi alifbo</span></label>
      </div>
    </fieldset>
    <section class="output-card" aria-labelledby="output-label">
      <div class="field-top"><label id="output-label" for="result">Natija</label><span id="count">0 belgi</span></div>
      <textarea id="result" readonly spellcheck="false" placeholder="Natija shu yerda paydo bo‘ladi…"></textarea>
    </section>
    <button type="button" id="copy" class="copy" disabled><span aria-hidden="true">▣</span> <span id="copy-label">Nusxa olish</span></button>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
